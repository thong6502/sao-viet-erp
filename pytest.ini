[pytest]
# pytest skips dot-directories by default, which would hide the harness's own hook test
# at .claude/hooks/test_guard_bash.py and make `python -m pytest` exit 5 (no tests collected)
# -> that would fail init.sh / init.ps1 under set -e even though the guard test passes.
# Overriding norecursedirs restores discovery of the .claude/ test while still skipping
# heavy/irrelevant dirs. Your own project tests (e.g. tests/, src/) are discovered too —
# no edit needed when you add them.
norecursedirs = .git .venv venv env __pycache__ node_modules build dist .pytest_cache .mypy_cache .ruff_cache
