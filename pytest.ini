[pytest]
# Test roots:
#   tests/          -> GAN-template integrity smoke (keeps init green, no app deps)
#   backend/tests/  -> real backend feature tests (FastAPI + SQLite in-memory)
#
# backend/tests is a package (has __init__.py) while backend/ is NOT, so pytest's
# prepend import mode puts backend/ on sys.path and `from app.main import app` works.
testpaths = tests backend/tests
