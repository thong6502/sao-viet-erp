# Phục vụ SPA (Vite build) + reverse-proxy API sang backend FastAPI trong cùng compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nén để tải nhanh
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 20m;

    # SSE real-time luồng gửi duyệt (kết nối sống lâu) — PHẢI tắt buffering/gzip để đẩy tức thì,
    # timeout dài để không bị cắt khi idle. Prefix dài hơn nên khớp TRƯỚC block /api/ chung.
    location /api/quotations/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";      # giữ keep-alive tới backend
        proxy_buffering off;                          # KHÔNG đệm → sự kiện ra ngay
        proxy_cache off;
        gzip off;                                     # nén sẽ đệm/vỡ SSE
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;                     # stream idle vẫn giữ 1h
    }

    # API → backend (GIỮ NGUYÊN prefix /api; không có dấu / cuối proxy_pass).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Assets có hash → cache dài
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: mọi route khác trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
