name: Deploy (production)

# Đẩy lên main → chạy CI gate rồi deploy sang VPS bằng Docker Compose.
# Có thể chạy tay ở tab Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Không cho 2 lần deploy chồng nhau; không hủy lần đang chạy (deploy dở nguy hiểm).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1) CI gate — không deploy nếu build/test gãy.
  # ---------------------------------------------------------------
  build-test:
    name: Build & test (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend: tsc + vite build (bắt lỗi type + build).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Backend: cài deps + chạy pytest (SQLite in-memory, không cần DB ngoài).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          pytest -q

  # ---------------------------------------------------------------
  # 2) Deploy — SSH vào VPS, kéo code, dựng lại containers.
  #    Dùng vars/secrets đã cấu hình trong repo Settings.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.APP_DIR }}"

            echo "→ Kéo code mới nhất (origin/main)"
            git fetch --all --prune
            git reset --hard origin/main

            # .env nằm ngoài git nên `git reset` không đụng tới — thêm khoá mới (Redis/MinIO)
            # mà quên cập nhật .env thì backend crash-loop. Chặn ngay ở đây cho dễ hiểu.
            echo "→ Kiểm .env có đủ khoá"
            REQUIRED="COMPOSE_PROFILES POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET SEED_ADMIN_PASSWORD CORS_ORIGINS SITE_DOMAIN MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
            MISSING=""
            for KEY in $REQUIRED; do
              VALUE=$(grep -E "^${KEY}=" .env | head -n1 | cut -d= -f2- || true)
              if [ -z "$VALUE" ] || [ "$VALUE" = "__DIEN_VAO__" ]; then
                MISSING="$MISSING $KEY"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "DỪNG deploy — .env trên VPS thiếu hoặc chưa điền:$MISSING"
              echo "Cách sửa: chép nội dung .env.prod (hoặc .env.stg) sang .env rồi điền các chỗ __DIEN_VAO__."
              exit 1
            fi

            # Dựng service nào là do COMPOSE_PROFILES trong .env quyết (bản triển khai khai đủ
            # 6). KHÔNG dùng --remove-orphans: chạy kèm profiles rất dễ xoá nhầm container của
            # profile đang tắt.
            echo "→ Dựng lại & khởi động containers"
            docker compose up -d --build

            echo "→ Dọn image cũ"
            docker image prune -f

            echo "→ Trạng thái"
            docker compose ps
