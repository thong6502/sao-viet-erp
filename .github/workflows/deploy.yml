name: Deploy (production)

# Đẩy lên main → chạy CI gate rồi deploy sang VPS bằng Docker Compose.
# Có thể chạy tay ở tab Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Không cho 2 lần deploy chồng nhau; không hủy lần đang chạy (deploy dở nguy hiểm).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1) CI gate — không deploy nếu build/test gãy.
  # ---------------------------------------------------------------
  build-test:
    name: Build & test (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend: tsc + vite build (bắt lỗi type + build).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Backend: cài deps + chạy pytest (SQLite in-memory, không cần DB ngoài).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          pytest -q

  # ---------------------------------------------------------------
  # 2) Deploy — SSH vào VPS, kéo code, dựng lại containers.
  #    Dùng vars/secrets đã cấu hình trong repo Settings.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ vars.APP_DIR }}"

            echo "→ Kéo code mới nhất (origin/main)"
            git fetch --all --prune
            git reset --hard origin/main

            echo "→ Dựng lại & khởi động containers"
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "→ Dọn image cũ"
            docker image prune -f

            echo "→ Trạng thái"
            docker compose -f docker-compose.prod.yml ps
