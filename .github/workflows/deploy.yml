name: Deploy

# Quy trình: nhánh tính năng → `dev` → test UI trên staging → `dev` vào `main` → production.
#   push `dev`  → deploy STAGING    (thư mục vars.APP_DIR_STG, .env lấy từ .env.stg)
#   push `main` → deploy PRODUCTION (thư mục vars.APP_DIR)
# Hai thư mục riêng vì bước deploy chạy `git reset --hard origin/<nhánh>` — hai nhánh khác nhau
# không dùng chung một cây làm việc được.
# Có thể chạy tay ở tab Actions (workflow_dispatch).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Không cho 2 lần deploy chồng nhau TRÊN CÙNG môi trường; không hủy lần đang chạy (deploy dở
# nguy hiểm). Tách theo nhánh để deploy staging không phải xếp hàng sau production.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1) CI gate — không deploy nếu build/test gãy.
  #    Định nghĩa nằm ở `build-test.yml` (dùng chung với CI của pull request), KHÔNG chép lại ở
  #    đây: hai bản rời nhau thì PR và deploy sẽ kiểm hai thứ khác nhau mà không ai biết.
  # ---------------------------------------------------------------
  build-test:
    uses: ./.github/workflows/build-test.yml

  # ---------------------------------------------------------------
  # 2) Deploy — SSH vào VPS, kéo code, dựng lại containers.
  #    Dùng vars/secrets đã cấu hình trong repo Settings.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ github.ref_name == 'main' && vars.APP_DIR || vars.APP_DIR_STG }}"

            echo "→ Kéo code mới nhất (origin/${{ github.ref_name }})"
            git fetch --all --prune
            git reset --hard "origin/${{ github.ref_name }}"

            # .env nằm ngoài git nên `git reset` không đụng tới — thêm khoá mới (Redis/MinIO)
            # mà quên cập nhật .env thì backend crash-loop. Chặn ngay ở đây cho dễ hiểu.
            echo "→ Kiểm .env có đủ khoá"
            REQUIRED="COMPOSE_PROFILES POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET SEED_ADMIN_PASSWORD CORS_ORIGINS SITE_DOMAIN MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
            MISSING=""
            for KEY in $REQUIRED; do
              VALUE=$(grep -E "^${KEY}=" .env | head -n1 | cut -d= -f2- || true)
              if [ -z "$VALUE" ] || [ "$VALUE" = "__DIEN_VAO__" ]; then
                MISSING="$MISSING $KEY"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "DỪNG deploy — .env trên VPS thiếu hoặc chưa điền:$MISSING"
              echo "Cách sửa: chép nội dung .env.prod (hoặc .env.stg) sang .env rồi điền các chỗ __DIEN_VAO__."
              exit 1
            fi

            # Dựng service nào là do COMPOSE_PROFILES trong .env quyết (bản triển khai khai đủ
            # 6). KHÔNG dùng --remove-orphans: chạy kèm profiles rất dễ xoá nhầm container của
            # profile đang tắt.
            echo "→ Dựng lại & khởi động containers"
            docker compose up -d --build

            echo "→ Dọn image cũ"
            docker image prune -f

            echo "→ Trạng thái"
            docker compose ps
